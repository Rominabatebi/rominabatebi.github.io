<title>Romina Batebi · Sales, Growth & Marketing</title>
<meta name="description" content="Romina Batebi – business development, lead generation and data-driven marketing in Vienna.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Data-art gallery: white canvas, light + heavy type, a generative chart made from real career data, big chart tiles. Colours use the validated categorical slots. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F4; --ink:#1C1917; --ink-2:#57534E; --muted:#78716C; --grid:#E7E5E4;
  --accent:#E2582A; --focus:#C98500; --neutral:#D6D3D1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#1C1917;
  --r:6px; --font:'Inter',system-ui,'Segoe UI',Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --h3font:700 21px/1.3 var(--font);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D0C; --surface:#171615; --surface-2:#22201E; --ink:#F5F5F4; --ink-2:#D6D3D1; --muted:#A8A29E; --grid:#2E2B29;
  --accent:#F07446; --neutral:#44403C; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#E7E5E4; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E0D0C; --surface:#171615; --surface-2:#22201E; --ink:#F5F5F4; --ink-2:#D6D3D1; --muted:#A8A29E; --grid:#2E2B29;
  --accent:#F07446; --neutral:#44403C; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#E7E5E4; color-scheme:dark }
/* ===== shared: detail sheet, charts, tools (uses each site's tokens) ===== */
*{box-sizing:border-box}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:var(--r);padding:22px;min-width:0}
.card h3{font-size:18px;font-weight:700}
.cap{font-size:14px;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vlist li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.vlist li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none}
.proof{border-radius:12px;padding:12px 14px;background:var(--surface-2);font-size:14px}
.vpanel{display:flex;flex-direction:column;gap:14px}
svg text{font-family:var(--font)}
/* gantt + matrix */
.gantt{display:flex;flex-direction:column;gap:6px}
.g-axis,.g-row{display:grid;grid-template-columns:240px 1fr;gap:12px;align-items:center}
@media (max-width:640px){.g-axis,.g-row{grid-template-columns:1fr;gap:2px}.g-axis .g-lab{display:none}}
.g-lab{font-size:13px;font-weight:700;line-height:1.25;min-width:0}
.g-lab small{display:block;font-weight:500;color:var(--muted)}
.g-track{position:relative;height:22px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px calc(100% / 9.75))}
.g-bar{position:absolute;top:3px;height:16px;border-radius:4px;cursor:pointer;min-width:6px;display:block}
.g-bar.future{opacity:.4}
.g-ticks{position:relative;height:18px;font:500 11px var(--mono);color:var(--muted)}
.g-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
@media (max-width:640px){.g-ticks span.minor{display:none}}
.g-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5;pointer-events:none}
.mx-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:780px;font-size:13px}
.mx th{font-weight:700;color:var(--ink-2);padding:6px 4px;text-align:center;vertical-align:bottom}
.mx th.rowh{text-align:left;color:var(--ink);padding-right:12px;white-space:nowrap}
.mx td{text-align:center;padding:7px 4px;border-top:1px solid var(--grid)}
.mx .on{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 2px var(--surface)}
.mx .off{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--grid)}
.mx .yr{display:block;font:500 11px var(--mono);color:var(--muted)}
/* project tools */
.ptop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.badge{font:700 12px var(--font);padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--s3) 16%,var(--surface));color:var(--ink)}
.aud{font-size:12px;color:var(--muted)}
.pv{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;margin-top:14px}
@media (max-width:900px){.pv{grid-template-columns:1fr}}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13px;color:var(--ink-2)}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--s1)}
.sl output{font:600 13px var(--mono);color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--grid);background:var(--surface);color:var(--ink);font:700 13px var(--font);padding:8px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.res div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center;min-width:0}
.res b{display:block;font-size:19px;font-weight:800}
.res small{font-size:11px;color:var(--ink-2)}
.tools{display:flex;flex-direction:column;gap:12px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flow .st{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.flow .st b{font-size:14px}.flow .st span{font-size:12px;color:var(--ink-2)}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.ngrid{grid-template-columns:1fr}}
.news{display:flex;flex-direction:column;gap:12px}
.news .src{font-size:12px;margin-top:auto}.news .src a{color:var(--muted)}
.waffle{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.waffle i{aspect-ratio:1;border-radius:2px;background:var(--grid)}
.waffle i.on{background:var(--s1)}
.pair{display:flex;flex-direction:column;gap:8px}
.pr{display:grid;grid-template-columns:76px 1fr 64px;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.pr i{display:block;height:18px;border-radius:0 4px 4px 0}
.pr b{color:var(--ink);font-weight:700}
.pr.wide{grid-template-columns:minmax(96px,140px) 1fr 64px}
.stack{display:flex;height:22px;gap:2px;border-radius:4px;overflow:hidden}
.stack i{display:block}
.dom{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.dtag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--grid);color:var(--ink-2)}
.dtag.dt-R{background:color-mix(in srgb,var(--s3) 16%,var(--surface));border-color:transparent;color:var(--ink)}
.dtag.dt-D{background:color-mix(in srgb,var(--s1) 14%,var(--surface));border-color:transparent;color:var(--ink)}
.insight{font:var(--h3font);margin:6px 0 2px}
.helpbox h3{font-size:17px;font-weight:700;margin-bottom:10px}
.funnel{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.fs{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;min-width:200px}
.fs b{font-size:17px}
.aiw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.ailist{margin:0;padding-left:20px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.ailist li.on{color:var(--ink);font-weight:800}
.lw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
@media (max-width:700px){.aiw,.lw{grid-template-columns:1fr}}
.k{font:600 12px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* sheet */
dialog#sheet{width:min(1080px,100% - 24px);max-height:calc(100% - 40px);border:0;padding:0;border-radius:var(--r);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog#sheet::backdrop{background:rgba(10,10,14,.55);backdrop-filter:blur(3px)}
@media (max-width:640px){dialog#sheet{width:100%;max-width:100%;max-height:100%;height:100%;border-radius:0;margin:0}}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(20px,env(safe-area-inset-left,0px)) 14px;background:var(--bg);border-bottom:1px solid var(--grid)}
.sheet-head h2{font:var(--h3font)}
.close{border:0;background:var(--surface-2);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
.sheet-body{padding:20px max(20px,env(safe-area-inset-left,0px)) 28px;display:flex;flex-direction:column;gap:18px}
.vt{display:flex;gap:6px}
.vt button{flex:1;border:1px solid var(--grid);background:var(--surface);color:var(--ink);font:700 13px var(--font);padding:9px;border-radius:12px;cursor:pointer}
.vt button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.screen{aspect-ratio:16/9;width:100%;border-radius:var(--r);overflow:hidden;position:relative;background:linear-gradient(135deg,#1d2a44,#3b2f5c)}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;color:#fff}
.screen .ph span{color:#cbd5e1;font-size:14px}
.play{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font:600 13px/1.4 var(--font);padding:8px 10px;border-radius:10px;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;left:0;top:0}
#tip.show{opacity:1;transform:none}
/* case study strip */
.case{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:c}
@media (max-width:900px){.case{grid-template-columns:1fr}}
.case li{position:relative;background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px 14px 14px;display:flex;flex-direction:column;gap:6px;animation:caseIn .45s both;animation-delay:calc(var(--i) * 90ms)}
.case li:nth-child(4){border-color:color-mix(in srgb,var(--s3) 55%,var(--grid));background:color-mix(in srgb,var(--s3) 7%,var(--surface))}
.case .cn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:var(--accent)}
.case li:nth-child(4) .cn{background:var(--s3)}
.case b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.case p{font-size:14px;line-height:1.5}
@keyframes caseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* reveal on scroll */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}
[data-tilt]{transition:transform .25s ease;transform-style:preserve-3d;will-change:transform}
/* workflow (AI section) */
.flowline{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:860px){.flowline{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.flowline{grid-template-columns:1fr}}
.flowline svg.wire{position:absolute;left:0;right:0;top:27px;width:100%;height:10px;overflow:visible;pointer-events:none}
@media (max-width:860px){.flowline svg.wire{display:none}}
.wire path{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 6;stroke-dashoffset:200;transition:stroke-dashoffset 2.4s linear}
.flowline.in .wire path{stroke-dashoffset:0}
.fstep{position:relative;display:flex;flex-direction:column;gap:8px}
.fstep .bub{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;background:var(--surface);border:2px solid var(--accent);color:var(--accent);position:relative;z-index:1;transition:transform .3s,background .3s,color .3s}
.flowline.in .fstep .bub{animation:pop .5s both;animation-delay:calc(var(--i) * 350ms + .2s)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12);background:var(--accent);color:#fff}100%{transform:scale(1)}}
.fstep b{font-size:16px}
.fstep p{font-size:14px;color:var(--ink-2)}
/* rotating prism */
.prism-wrap{perspective:1100px;display:grid;place-items:center;height:240px}
.prism{width:200px;height:150px;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.prism-wrap:hover .prism{animation-play-state:paused}
.prism div{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:17px;text-align:center;padding:12px;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.prism div small{font-weight:500;font-size:12px;opacity:.9}
.prism div:nth-child(1){transform:rotateY(0deg) translateZ(100px)}
.prism div:nth-child(2){transform:rotateY(90deg) translateZ(100px)}
.prism div:nth-child(3){transform:rotateY(180deg) translateZ(100px)}
.prism div:nth-child(4){transform:rotateY(270deg) translateZ(100px)}
@keyframes spin{from{transform:rotateX(-8deg) rotateY(0)}to{transform:rotateX(-8deg) rotateY(-360deg)}}
@media (prefers-reduced-motion: reduce){.prism{animation:none}.rv{opacity:1;transform:none}.wire path{stroke-dashoffset:0}}
/* help cards */
.helpgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.helpgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.helpgrid{grid-template-columns:1fr}}
.hc{background:var(--surface);border:1px solid var(--grid);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
.hc .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.hc b{font-size:17px}
.hc p{font-size:14px;color:var(--ink-2)}
.hc .ex{font-size:12px;color:var(--muted);margin-top:auto;border-top:1px solid var(--grid);padding-top:8px}

html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto}
a{color:inherit}
.up{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.bar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;gap:24px;padding-block:20px}
.logo{font-weight:800;letter-spacing:.24em;font-size:13px;text-decoration:none}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.nav a:hover{color:var(--ink)}
.lang{display:flex;gap:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--font);letter-spacing:.1em;padding:4px 7px;cursor:pointer;border-bottom:2px solid transparent}
.lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:860px){.nav{display:none}.lang{margin-left:auto}}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:40px 0 70px}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-top:16px}}
.hero h1{font:300 clamp(48px,7vw,86px)/1 var(--font);letter-spacing:-.04em}
.hero h1 b{font-weight:800;display:block}
.lead{font-size:19px;color:var(--ink-2);margin-top:24px;max-width:42ch}
.me{display:flex;gap:14px;align-items:center;margin-top:28px;font-size:14px;color:var(--ink-2)}
.me img{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:50% 16%}
.me b{display:block;color:var(--ink)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px;border:1px solid var(--ink);text-decoration:none}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.art{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.art svg{width:100%;max-width:480px;height:auto;overflow:visible}
#art g.spin{animation:artspin 140s linear infinite;transform-origin:0 0}
.art:hover #art g.spin{animation-play-state:paused}
@keyframes artspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){#art g.spin{animation:none}}
.aiwrap{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}
@media (max-width:700px){.aiwrap{grid-template-columns:1fr}}
.art .dt{cursor:pointer;transition:opacity .15s}
.art svg:hover .dt{opacity:.35}.art svg .dt:hover{opacity:1}
.art .legend{justify-content:center}
.art .cap{text-align:center;font-size:13px;max-width:440px}
/* gallery */
section{padding-top:90px}
.sh{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:end;margin-bottom:26px}
.sh h2{font:300 clamp(32px,4vw,48px)/1.05 var(--font);letter-spacing:-.03em;margin-top:8px}
.sh h2 b{font-weight:800}
.sh p{color:var(--ink-2);max-width:46ch}
.gal{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-auto-rows:260px;gap:26px}
@media (max-width:900px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:220px}}
@media (max-width:560px){.gal{grid-template-columns:1fr;grid-auto-rows:auto}}
.tl{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.tl:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.tl.big{grid-row:span 2}
@media (max-width:560px){.tl.big{grid-row:auto}}
.tl .img{flex:1;min-height:150px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:transform .25s}
.tl:hover .img{transform:scale(1.015)}
.tl .img svg{width:76%;height:auto;max-height:62%;margin-top:40px}
@media (max-width:560px){.tl .img{height:230px;flex:none}.tl.big .img .bn{font-size:30px}.tl .img svg{max-height:56%;margin-top:52px}}
.tl .img .bn{position:absolute;left:18px;top:14px;font-weight:800;font-size:28px;letter-spacing:-.03em;color:var(--ink)}
.tl.big .img .bn{font-size:44px}
.tl .img{flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:16px 18px 18px}
.tl .img .tag{order:-1;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);margin-bottom:8px}
.tl .img .tag.real{color:var(--ink)}
.tl .img .bn{position:static;line-height:1.05}
.tl .img .bl{font-size:13px;line-height:1.4;color:var(--ink-2);max-width:34ch;margin-top:4px}
.tl.big .img .bl{font-size:15.5px}
.tl .img svg{margin:auto auto 0!important;width:72%;max-height:46%;flex:none}
.tl.big .img svg{max-height:52%}
@media (max-width:900px){.tl .img svg{max-height:38%}}
@media (max-width:560px){.tl .img{height:auto!important;min-height:250px}.tl.big .img .bn{font-size:32px}.tl .img .bl{font-size:13px}.tl .img svg{margin-top:16px!important;max-height:120px}}
.tl .go{margin-top:6px;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.tl .go span{display:inline-block;transition:transform .25s}
.tl:hover .go span,.tl:focus-visible .go span{transform:translateX(5px)}
.tl:hover .img{box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tl .img svg rect{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.tl .img svg circle{transition:opacity .9s ease .3s}
.tl.rv:not(.in) .img svg rect{transform:scaleY(.12)}
.tl.rv:not(.in) .img svg circle{opacity:.15}
.tl .img svg rect:nth-of-type(2){transition-delay:.08s}.tl .img svg rect:nth-of-type(3){transition-delay:.16s}.tl .img svg rect:nth-of-type(4){transition-delay:.24s}
.tl .img svg rect:nth-of-type(5){transition-delay:.32s}.tl .img svg rect:nth-of-type(6){transition-delay:.4s}.tl .img svg rect:nth-of-type(7){transition-delay:.48s}.tl .img svg rect:nth-of-type(8){transition-delay:.56s}
@media (prefers-reduced-motion:reduce){.tl .img svg rect,.tl .img svg circle{transition:none!important;transform:none!important;opacity:1!important}}
.tl .cp{padding-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tl .cp b{font-size:17px;font-weight:700}
.tl .cp .up{font-size:11px}
/* about */
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:center}
@media (max-width:900px){.about{grid-template-columns:1fr;gap:28px}}
.about img{width:100%;max-width:420px;aspect-ratio:4/5;height:auto;object-fit:cover;object-position:50% 18%;border-radius:var(--r);display:block}
.about p.txt{font-size:19px;font-weight:300;line-height:1.55}
.about p.txt b{font-weight:700}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:30px;border-top:1px solid var(--grid);padding-top:22px}
@media (max-width:640px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nums b{display:block;font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.nums span{font-size:13px;color:var(--muted)}
.nums i{display:block;width:24px;height:3px;margin-bottom:10px}
/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{border-top:3px solid;padding-top:16px}
.step .up{font-size:11px}
.step h3{font-weight:800;font-size:24px;letter-spacing:-.02em;margin:4px 0 6px}
.step p{color:var(--ink-2);font-size:15px}
/* story gantt */
.sg{display:flex;flex-direction:column;gap:10px}
.sgr{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:700px){.sgr{grid-template-columns:1fr;gap:4px}}
.sgr .lb b{display:block;font-weight:700;font-size:15px;line-height:1.3}
.sgr .lb span{font-size:13px;color:var(--muted)}
.trk{position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px calc(100% / 7))}
.trk i{position:absolute;top:4px;height:18px;border-radius:9px;display:block}
.axis{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;font:500 11px var(--mono);color:var(--muted)}
.axis div{position:relative;height:16px}.axis div span{position:absolute;transform:translateX(-50%)}
@media (max-width:700px){.axis{grid-template-columns:1fr}.axis>i{display:none}}
.why2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
@media (max-width:700px){.why2{grid-template-columns:1fr;gap:24px}}
.wy b{display:block;font-weight:800;font-size:clamp(56px,7vw,88px);line-height:1;letter-spacing:-.05em;color:var(--accent)}
.wy p{font-size:18px;font-weight:300;margin-top:10px}
.wy small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.mt{margin-top:22px}
/* contact */
.contact{padding:110px 0 60px;text-align:center;display:flex;flex-direction:column;align-items:center}
.contact h2{font:300 clamp(40px,6.4vw,80px)/1 var(--font);letter-spacing:-.045em;margin:12px 0 18px}
.contact h2 b{font-weight:800;color:var(--accent)}
.contact p{color:var(--ink-2);max-width:52ch}
.contact .mail{font:500 20px var(--mono);margin:28px 0 16px;user-select:all;word-break:break-all}
.other{margin-top:30px;font-size:14px;color:var(--ink-2)}
.other a{font-weight:600}
footer{padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--grid);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}

const PV = { Italy: { capex: 690, yield: 1550, price: 56.82, wacc: 6.0, years: 20, merchant: 92.75 },
             Poland: { capex: 572, yield: 1050, price: 64.46, wacc: 7.0, years: 15, merchant: 68.43 } };
const pvS = { country: "Italy", ...PV.Italy };
function pvCalc(s) {
  const life = 25, deg = .004, trend = -.02, opex = 13, curt = s.country === "Italy" ? .01 : .03, cf = []; let pvE = 0, pvC = s.capex;
  for (let y = 1; y <= life; y++) {
    const e = s.yield * (1 - curt) * Math.pow(1 - deg, y - 1) / 1000, price = y <= s.years ? s.price : s.merchant * Math.pow(1 + trend, y - 1);
    cf.push(e * price - opex); const d = Math.pow(1 + s.wacc / 100, y); pvE += e / d; pvC += opex / d;
  }
  const npvAt = r => cf.reduce((a, c, i) => a + c / Math.pow(1 + r, i + 1), -s.capex);
  let lo = -.5, hi = 1; for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (npvAt(m) > 0) lo = m; else hi = m; }
  return { npv: npvAt(s.wacc / 100) * .01, irr: (lo + hi) / 2, lcoe: pvC / pvE };
}
function histogram() {
  const W = 620, H = 270, L = 44, R = 12, Tp = 18, B = 40, E = MC.edges, x0 = E[0], x1 = E[E.length - 1], ymax = 1100;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => Tp + (1 - v / ymax) * (H - Tp - B);
  const path = arr => { let d = `M${X(E[0])},${Y(0)}`; arr.forEach((v, i) => { d += ` L${X(E[i])},${Y(v)} L${X(E[i + 1])},${Y(v)}`; }); return d + ` L${X(x1)},${Y(0)}`; };
  let g = "";
  [0, 500, 1000].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf().format(v)}</text>`; });
  [-200, 0, 200, 400].forEach(v => { g += `<text x="${X(v)}" y="${H - B + 20}" text-anchor="middle" font-size="11" fill="var(--muted)">${v}</text>`; });
  g += `<text x="${L - 8}" y="${Tp - 6}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(t("runs"))}</text>`;
  [["Poland", "var(--s2)"], ["Italy", "var(--s1)"]].forEach(([c, col]) => { g += `<path d="${path(MC[c])}" fill="${col}" fill-opacity=".14" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`; });
  g += `<line x1="${X(0)}" x2="${X(0)}" y1="${Tp}" y2="${H - B}" stroke="var(--ink)" stroke-width="1.5"/><text x="${X(0) + 6}" y="${Tp + 12}" font-size="11" font-weight="700" fill="var(--ink)">NPV = 0</text>`;
  g += `<circle cx="${X(-110)}" cy="${Y(1066) - 14}" r="5" fill="var(--s2)"/><text x="${X(-110) + 10}" y="${Y(1066) - 10}" font-size="12" font-weight="700" fill="var(--ink)">${esc(t("pl"))}</text>`;
  g += `<circle cx="${X(225)}" cy="${Y(857) - 14}" r="5" fill="var(--s1)"/><text x="${X(225) + 10}" y="${Y(857) - 10}" font-size="12" font-weight="700" fill="var(--ink)">${esc(t("it"))}</text>`;
  E.slice(0, -1).forEach((e, i) => {
    const tt = `<b>${e} ${t("to")} ${E[i + 1]} k€/MW</b><br>${t("it")}: ${MC.Italy[i]} ${t("runs")}<br>${t("pl")}: ${MC.Poland[i]} ${t("runs")}`;
    g += `<rect x="${X(e)}" y="${Tp}" width="${X(E[i + 1]) - X(e)}" height="${H - Tp - B}" fill="transparent" data-tip="${esc(tt)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("pv_cap"))}">${g}</svg>`;
}

const INFL = [[2023, 7.7, "a"], [2024, 2.9, "a"], [2025, 3.6, "a"], [2026, 3.2, "f"], [2027, 2.4, "f"], [2028, 2.1, "f"]];

  g += `<line x1="${L}" x2="${W - R}" y1="${Y(2)}" y2="${Y(2)}" stroke="var(--s3)" stroke-width="2"/><text x="${X(2024)}" y="${Y(2) + 16}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${esc(pt("ec_tgt"))}</text>`;

  g += `<polyline points="${fc.map(d => X(d[0]) + "," + Y(d[1])).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-dasharray="5 5"/>`;
  INFL.forEach(([y, v, k]) => { g += `<circle cx="${X(y)}" cy="${Y(v)}" r="5" fill="${k === "a" ? "var(--s1)" : "var(--surface)"}" stroke="var(--s1)" stroke-width="2" data-tip="${y}: ${nf(1).format(v)}% · ${esc(k === "a" ? pt("ec_act") : pt("ec_fc"))}"/><text x="${X(y)}" y="${Y(v) - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${nf(1).format(v)}</text>`; });
  box.innerHTML = `<p class="cap">HICP Austria, % p.a.</p><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Austria inflation 2023–2028">${g}</svg>
    <div class="legend"><span><i style="background:var(--s1)"></i>${esc(pt("ec_act"))}</span><span><i style="background:var(--surface);border:2px dashed var(--s1)"></i>${esc(pt("ec_fc"))}</span></div>
    <div class="tools" style="margin-top:16px"><b>${esc(pt("ec_tool"))}</b>

      <div class="pair" id="ecBars"></div><p class="cap" style="font-size:12px">${esc(pt("ec_note"))} i = r* + π + 0.5 (π − 2) + 0.5 · gap</p></div>
    <p class="cap" style="font-size:12px">${esc(pt("src"))}: <a href="https://www.statistik.at/fileadmin/announcement/2026/01/20260119VPIJahr2025EN.pdf" target="_blank" rel="noopener">Statistik Austria</a> · <a href="https://www.oenb.at/dam/jcr:6db8147c-8327-4029-b135-e559257835fc/2026-06-12-PK_FINAL.pdf" target="_blank" rel="noopener">OeNB June 2026</a> · <a href="https://www.mtsinsights.com/summaries/10870/" target="_blank" rel="noopener">ECB decision 10 Sep 2026</a></p>`;

/* ---------- data science: forecast with range (example data) ---------- */
const FCD = (() => { const a = []; let s = 7; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280 - .5; };
  for (let m = 0; m < 36; m++) a.push(100 + m * .9 + 14 * Math.sin((m % 12) / 12 * 2 * Math.PI - 1.2) + rnd() * 9); return a; })();
let fcH = 12;
function renderForecast() {
  const box = $("#p-fc"), n = FCD.length;
  const season = Array(12).fill(0), cnt = Array(12).fill(0);
  const xs = FCD.map((_, i) => i), mx = xs.reduce((a, b) => a + b) / n, my = FCD.reduce((a, b) => a + b) / n;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (FCD[i] - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0), icp = my - slope * mx;
  FCD.forEach((v, i) => { season[i % 12] += v - (icp + slope * i); cnt[i % 12]++; });
  for (let k = 0; k < 12; k++) season[k] /= cnt[k];
  const resid = FCD.map((v, i) => v - (icp + slope * i + season[i % 12])), sd = Math.sqrt(resid.reduce((a, r) => a + r * r, 0) / (n - 13));
  const W = 620, H = 260, L = 40, R = 14, Tp = 16, B = 34, total = n + 12, X = i => L + i / (total - 1) * (W - L - R), Y = v => Tp + (1 - (v - 60) / 120) * (H - Tp - B);
  const draw = () => {
    const fc = []; for (let h = 1; h <= fcH; h++) { const i = n - 1 + h, m = icp + slope * i + season[i % 12], w = 1.28 * sd * Math.sqrt(1 + h / 3); fc.push([i, m, m - w, m + w]); }
    let g = "";
    [80, 120, 160].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; });
    ["Y1", "Y2", "Y3", "Y4"].forEach((yl, k) => { g += `<text x="${X(k * 12 + 6)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${yl}</text>`; });
    const band = [[n - 1, FCD[n - 1], FCD[n - 1]]].concat(fc.map(f => [f[0], f[2], f[3]]));
    g += `<path d="M${band.map(b => X(b[0]) + "," + Y(b[2])).join(" L")} L${band.slice().reverse().map(b => X(b[0]) + "," + Y(b[1])).join(" L")}Z" fill="var(--s2)" fill-opacity=".14"/>`;
    g += `<polyline points="${FCD.map((v, i) => X(i) + "," + Y(v)).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
    g += `<polyline points="${[[n - 1, FCD[n - 1]]].concat(fc.map(f => [f[0], f[1]])).map(p => X(p[0]) + "," + Y(p[1])).join(" ")}" fill="none" stroke="var(--s2)" stroke-width="2"/>`;
    const last = fc[fc.length - 1];
    g += `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><text x="${X(last[0]) - 8}" y="${Y(last[3]) - 6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(last[2])}–${Math.round(last[3])}</text>`;
    fc.forEach(f => { g += `<rect x="${X(f[0]) - 6}" y="${Tp}" width="12" height="${H - Tp - B}" fill="transparent" data-tip="${esc(pt("fc_fc"))}: ${Math.round(f[1])} (${Math.round(f[2])}–${Math.round(f[3])})"/>`; });
    box.querySelector("#fcSvg").innerHTML = g;
  };
  box.innerHTML = `<svg id="fcSvg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Forecast"></svg>
    <div class="legend"><span><i style="background:var(--s1)"></i>${esc(pt("fc_hist"))}</span><span><i style="background:var(--s2)"></i>${esc(pt("fc_fc"))}</span><span><i style="background:color-mix(in srgb,var(--s2) 25%,var(--surface))"></i>${esc(pt("fc_band"))}</span></div>
    <div class="tools" style="margin-top:12px">${sl("fh", pt("fc_h"), 3, 12, 1, fcH, v => v + (lang === "de" ? " Mon." : " mo."))}<p class="cap" style="font-size:12px">${esc(pt("fc_note"))}</p></div>`;
  const el = box.querySelector("#fh"); el.oninput = () => { fcH = +el.value; box.querySelector("#fh-o").textContent = fcH + (lang === "de" ? " Mon." : " mo."); draw(); };
  draw();
}

/* ===== small chart thumbnails for the project lists (drawn from the real project data) ===== */
function thumb(k, w, h, col) {
  const pad = 6, X = (i, n) => pad + i * (w - 2 * pad) / (n - 1), sv = inner => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="color:${col}">${inner}</svg>`;
  const line = (vals, mx, mn = 0, area = true) => { const Y = v => h - pad - (v - mn) / (mx - mn) * (h - 2 * pad), d = vals.map((v, i) => `${X(i, vals.length).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    return (area ? `<polygon points="${pad},${h - pad} ${d} ${w - pad},${h - pad}" fill="currentColor" fill-opacity=".14"/>` : "") + `<polyline points="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(vals.length - 1, vals.length)}" cy="${Y(vals[vals.length - 1])}" r="3" fill="currentColor"/>`; };
  const bars = (vals, horiz) => { const mx = Math.max(...vals), n = vals.length;
    if (horiz) { const bh = (h - 2 * pad) / n; return vals.map((v, i) => `<rect x="${horiz === "c" ? (w - (w - 2 * pad) * v / mx) / 2 : pad}" y="${pad + i * bh + 1.5}" width="${(w - 2 * pad) * v / mx}" height="${bh - 3}" rx="2" fill="currentColor" fill-opacity="${1 - i * .18}"/>`).join(""); }
    const bw = (w - 2 * pad) / n; return vals.map((v, i) => `<rect x="${pad + i * bw + 2}" y="${h - pad - (h - 2 * pad) * v / mx}" width="${bw - 4}" height="${(h - 2 * pad) * v / mx}" rx="2" fill="currentColor" fill-opacity="${.45 + .55 * v / mx}"/>`).join(""); };
  switch (k) {
    case "econ": return sv(`<line x1="${pad}" x2="${w - pad}" y1="${h - pad - 2 / 8 * (h - 2 * pad)}" y2="${h - pad - 2 / 8 * (h - 2 * pad)}" stroke="var(--muted)" stroke-dasharray="3 3"/>` + line(INFL.map(d => d[1]), 8, 0, false));
    case "pv": { const it = MC.Italy, pl = MC.Poland, mx = 1066, Y = v => h - pad - v / mx * (h - 2 * pad), pth = a => `M${pad},${h - pad} ` + a.map((v, i) => `L${X(i, a.length).toFixed(1)},${Y(v).toFixed(1)}`).join(" ") + ` L${w - pad},${h - pad}Z`;
      return sv(`<path d="${pth(pl)}" fill="var(--muted)" fill-opacity=".25"/><path d="${pth(it)}" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="1.5"/>`); }
    case "cfo": { const Y = v => h - pad - v / 1300 * (h - 2 * pad), bw = (w - 2 * pad) / WF.length; let run = 0;
      return sv(WF.map((v, i) => { const tot = i === 0 || i === WF.length - 1, a = tot ? 0 : run, b = tot ? v : run + v; run = tot ? v : run + v;
        return `<rect x="${pad + i * bw + 1.5}" y="${Y(Math.max(a, b))}" width="${bw - 3}" height="${Math.max(1.5, Math.abs(Y(a) - Y(b)))}" fill="currentColor" fill-opacity="${tot ? .35 : v < 0 ? 1 : .6}"/>`; }).join("")); }
    case "fc": { const hist = FCD.slice(12), mx = 175, mn = 75;
      const Y = v => h - pad - (v - mn) / (mx - mn) * (h - 2 * pad), n = hist.length + 8, Xn = i => pad + i * (w - 2 * pad) / (n - 1);
      const fc = Array.from({ length: 8 }, (_, j) => FCD[24 + j + 4] + 6);
      return sv(`<polyline points="${hist.map((v, i) => `${Xn(i)},${Y(v)}`).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.6"/>` +
        `<polygon points="${fc.map((v, j) => `${Xn(hist.length + j)},${Y(v + 4 + j * 1.6)}`).join(" ")} ${fc.map((v, j) => `${Xn(hist.length + j)},${Y(v - 4 - j * 1.6)}`).reverse().join(" ")}" fill="currentColor" fill-opacity=".2"/>` +
        `<polyline points="${Xn(hist.length - 1)},${Y(hist[hist.length - 1])} ${fc.map((v, j) => `${Xn(hist.length + j)},${Y(v)}`).join(" ")}" fill="none" stroke="currentColor" stroke-width="2"/>`); }
    case "auto": return sv(`<rect x="${pad}" y="${h * .22}" width="${w - 2 * pad}" height="${h * .2}" rx="2" fill="var(--muted)" fill-opacity=".35"/><rect x="${pad}" y="${h * .58}" width="${(w - 2 * pad) * .042 + 3}" height="${h * .2}" rx="2" fill="currentColor"/>`);
    case "ai": { const Xa = e => pad + (e - .5) / 9.5 * (w - 2 * pad), Ya = i => h - pad - (i - .5) / 9.5 * (h - 2 * pad);
      return sv(`<line x1="${w / 2}" x2="${w / 2}" y1="${pad}" y2="${h - pad}" stroke="var(--muted)" stroke-opacity=".5"/><line x1="${pad}" x2="${w - pad}" y1="${h / 2}" y2="${h / 2}" stroke="var(--muted)" stroke-opacity=".5"/>` +
        AIU.map(u => `<circle cx="${Xa(u.e)}" cy="${Ya(u.i)}" r="3.5" fill="${u.en[2].startsWith("High") ? "var(--s2)" : "currentColor"}"/>`).join("")); }
    case "sales": return sv(bars([31, 22, 14], "c"));
    case "lead": return sv(bars([78, 74, 68, 64, 60, 48, 48, 34], false));
    case "mkt": return sv(bars([100, 67, 33, 143], false));
    case "fin": return sv([0, 1, 2, 3].map(i => `<circle cx="${pad + 8 + i * (w - 2 * pad - 16) / 3}" cy="${h / 2}" r="${i === 3 ? 7 : 5}" fill="currentColor" fill-opacity="${.4 + i * .2}"/>`).join("") + `<line x1="${pad + 8}" x2="${w - pad - 8}" y1="${h / 2}" y2="${h / 2}" stroke="currentColor" stroke-opacity=".4"/>`);
  }
  return "";
}

/* ===== motion: reveal on scroll, count-up numbers, 3D tilt (all off with reduced motion) ===== */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let revealObs = null;
function initMotion(root = document) {
  if (REDUCED || !("IntersectionObserver" in window)) { root.querySelectorAll(".rv").forEach(el => el.classList.add("in")); return; }
  if (!revealObs) revealObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); countUp(e.target); revealObs.unobserve(e.target); } }), { threshold: .14 });
  root.querySelectorAll(".rv:not(.in)").forEach(el => revealObs.observe(el));
  root.querySelectorAll("[data-tilt]").forEach(el => {
    if (el._tilt) return; el._tilt = 1;
    el.addEventListener("pointermove", e => { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      el.style.transform = `perspective(900px) rotateY(${x * 7}deg) rotateX(${-y * 7}deg) translateY(-3px)`; });
    el.addEventListener("pointerleave", () => { el.style.transform = ""; });
  });
}
function countUp(scope) {
  if (REDUCED) return;
  scope.querySelectorAll("[data-count]").forEach(el => {
    const txt = el.textContent, m = txt.match(/[\d.,]+/); if (!m) return;
    const raw = m[0], num = parseFloat(raw.replace(/[.,](?=\d{3}\b)/g, "").replace(",", ".")); if (!isFinite(num) || num === 0) return;
    const dec = (raw.match(/[.,](\d{1,2})$/) || [, ""])[1].length, t0 = performance.now(), dur = 1100;
    const fmt = v => { const s = v.toFixed(dec); return txt.replace(raw, raw.includes(",") && !raw.includes(".") && dec ? s.replace(".", ",") : (raw.length > 3 && /[.,]\d{3}/.test(raw) ? Number(s).toLocaleString(lang === "de" ? "de-AT" : "en-GB") : s)); };
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(num * e); if (p < 1) requestAnimationFrame(step); else el.textContent = txt; };
    requestAnimationFrame(step);
  });
}
